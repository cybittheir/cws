name: Go checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27' }
      - run: gofmt -d ./cmd ./internal
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/server
