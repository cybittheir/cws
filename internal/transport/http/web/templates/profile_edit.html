<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="/static/styles.css"><title>Контакты</title></head><body class="simple"><main><a href="/profile">← Мой профиль</a><h1>Изменение контактов</h1>{{if .Error}}<div class="error">{{.Error}}</div>{{end}}<form class="form-card" method="post"><input type="hidden" name="version" value="{{.Employee.Version}}"><label>Мобильный телефон<input name="mobile_phone" value="{{.Employee.MobilePhone}}"></label><label>Личный email<input name="personal_email" value="{{.Employee.PersonalEmail}}"></label><label><input type="checkbox" name="show_personal_email" {{if .Employee.ShowPersonalEmail}}checked{{end}}> Показывать личный email коллегам</label><label>Telegram<input name="telegram_url" value="{{.Employee.TelegramURL}}"></label><label>Mattermost<input name="mattermost_url" value="{{.Employee.MattermostURL}}"></label><button class="primary">Сохранить</button></form></main></body></html>
